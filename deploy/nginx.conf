# Example for nginx (certificates e.g. via certbot). For the admin domain
# add a second server block with server_name admin.example.com.

server {
    listen 443 ssl http2;
    server_name cam.example.com;

    ssl_certificate     /etc/letsencrypt/live/cam.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cam.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5036;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket (phone sends images)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Do not buffer live streams and do not cut them off after 60 s
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 4m;
    }
}

# belongs in the http block (e.g. /etc/nginx/conf.d/websocket.conf):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
