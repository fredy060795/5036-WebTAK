# WebTAK / Helm Camera Streams on port 5036.
#
# Option A (default): server directly on https://<domain>:5036 with an existing certificate,
#   e.g. the Let's Encrypt certificate of the TAK server. Adjust the paths below, then:
#     docker compose up -d
#
# Option B: additionally Caddy on 80/443 (only if those ports are free), obtains certificates itself:
#     docker compose --profile caddy up -d
#   Then enter the domains in deploy/Caddyfile and remove TLS_CERT/TLS_KEY below.
services:
  helmcam:
    build: .
    restart: unless-stopped
    # root, because the Let's Encrypt private key is only readable by root
    user: root
    ports:
      - "5036:5036"
    environment:
      PORT: 5036
      PUBLIC_URL: https://tak.example.com:5036
      # Admin reachable only under this address (optional, otherwise delete the line):
      # ADMIN_HOST: admin.example.com
      TLS_CERT: /etc/letsencrypt/live/tak.example.com/fullchain.pem
      TLS_KEY: /etc/letsencrypt/live/tak.example.com/privkey.pem
    volumes:
      - helmcam-data:/data
      # Server certificates (Let's Encrypt), read-only. Renewed certificates
      # are picked up automatically (hourly check), without a restart.
      - /etc/letsencrypt:/etc/letsencrypt:ro

  caddy:
    profiles: ["caddy"]
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - helmcam

volumes:
  helmcam-data:
  caddy-data:
